<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <filter id="thermalShadow" x="-15%" y="-5%" width="130%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1050" fill="#e2e8f0" />

  <!-- Thermal Paper Roll Receipt -->
  <g transform="translate(180, 25)" filter="url(#thermalShadow)">
    <rect width="440" height="1000" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Serrated Top Edge -->
    <line x1="0" y1="3" x2="440" y2="3" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2" />

    <!-- Receipt Header -->
    <g transform="translate(30, 30)">
      <text x="190" y="24" fill="#0f172a" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="20" font-weight="900" text-anchor="middle">فروشگاه آنلاین پارس تکنولوژی</text>
      <text x="190" y="48" fill="#475569" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">رسید تحویل و فاکتور حرارتی (۸۰mm)</text>
      <text x="190" y="68" fill="#64748b" font-family="Tahoma, sans-serif" font-size="11" text-anchor="middle">تلفن: ۰۲۱-۸۸۹۹۰۰۱۱ • شیراز، خیابان ملاصدرا</text>
    </g>

    <!-- Dashed separator -->
    <line x1="25" y1="120" x2="415" y2="120" stroke="#0f172a" stroke-dasharray="5,4" stroke-width="1.2" />

    <!-- Order Meta Grid -->
    <g transform="translate(30, 140)" font-family="Tahoma, sans-serif" font-size="12" fill="#1e293b">
      <text x="380" y="16" text-anchor="end">شماره فاکتور:</text>
      <text x="0" y="16" text-anchor="start" font-weight="bold">#۱۴۰۲-۸۸۴۲</text>

      <text x="380" y="38" text-anchor="end">تاریخ و ساعت:</text>
      <text x="0" y="38" text-anchor="start">۱۴۰۲/۱۲/۱۵ - ۱۴:۳۵</text>

      <text x="380" y="60" text-anchor="end">نام مشتری:</text>
      <text x="0" y="60" text-anchor="start" font-weight="bold">علی رضایی</text>

      <text x="380" y="82" text-anchor="end">تلفن خریدار:</text>
      <text x="0" y="82" text-anchor="start">۰۹۱۲۳۴۵۶۷۸۹</text>

      <text x="380" y="104" text-anchor="end">وضعیت پرداخت:</text>
      <text x="0" y="104" text-anchor="start" font-weight="bold" fill="#0f766e">پرداخت اینترنتی (موفق)</text>
    </g>

    <!-- Dashed separator -->
    <line x1="25" y1="265" x2="415" y2="265" stroke="#0f172a" stroke-dasharray="5,4" stroke-width="1.2" />

    <!-- Items Header -->
    <g transform="translate(25, 280)">
      <rect width="390" height="28" fill="#f1f5f9" />
      <g font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">
        <text x="380" y="19" text-anchor="end">شرح کالا</text>
        <text x="190" y="19" text-anchor="middle">تعداد × قیمت</text>
        <text x="10" y="19" text-anchor="start">مبلغ کل</text>
      </g>
    </g>

    <!-- Items Rows -->
    <g transform="translate(25, 320)" font-family="Tahoma, sans-serif">
      <!-- Item 1 -->
      <text x="380" y="18" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="end">۱. هدفون بی‌سیم نویز کنسلینگ Pro</text>
      <text x="190" y="36" fill="#64748b" font-size="11" text-anchor="middle">۱ عدد × ۲,۴۵۰,۰۰۰</text>
      <text x="10" y="36" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="start">۲,۴۵۰,۰۰۰</text>
      <line x1="0" y1="48" x2="390" y2="48" stroke="#e2e8f0" />

      <!-- Item 2 -->
      <g transform="translate(0, 58)">
        <text x="380" y="18" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="end">۲. کابل شارژ سریع Type-C به لایتنینگ</text>
        <text x="190" y="36" fill="#64748b" font-size="11" text-anchor="middle">۲ عدد × ۱۹۰,۰۰۰</text>
        <text x="10" y="36" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="start">۳۸۰,۰۰۰</text>
        <line x1="0" y1="48" x2="390" y2="48" stroke="#e2e8f0" />
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 116)">
        <text x="380" y="18" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="end">۳. آداپتور اورجینال فست شارژ ۲۰ وات</text>
        <text x="190" y="36" fill="#64748b" font-size="11" text-anchor="middle">۱ عدد × ۶۵۰,۰۰۰</text>
        <text x="10" y="36" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="start">۶۵۰,۰۰۰</text>
        <line x1="0" y1="48" x2="390" y2="48" stroke="#e2e8f0" />
      </g>
    </g>

    <!-- Dashed separator -->
    <line x1="25" y1="505" x2="415" y2="505" stroke="#0f172a" stroke-dasharray="5,4" stroke-width="1.2" />

    <!-- Totals Area -->
    <g transform="translate(30, 520)" font-family="Tahoma, sans-serif" font-size="12" fill="#1e293b">
      <text x="380" y="18" text-anchor="end">جمع کل اقلام:</text>
      <text x="0" y="18" text-anchor="start">۳,۴۸۰,۰۰۰ تومان</text>

      <text x="380" y="42" text-anchor="end">تخفیف ویژه سفارش:</text>
      <text x="0" y="42" text-anchor="start" fill="#ef4444">۱۸۰,۰۰۰- تومان</text>

      <text x="380" y="66" text-anchor="end">هزینه پیک / ارسال:</text>
      <text x="0" y="66" text-anchor="start">۴۵,۰۰۰ تومان</text>

      <!-- Bold Final Box -->
      <g transform="translate(0, 85)">
        <rect width="380" height="52" rx="6" fill="#0f172a" />
        <text x="365" y="32" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="14" font-weight="bold" text-anchor="end">مبلغ کل قابل پرداخت:</text>
        <text x="15" y="33" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="16" font-weight="900" text-anchor="start">۳,۳۴۵,۰۰۰ تومان</text>
      </g>
    </g>

    <!-- Barcode Section -->
    <g transform="translate(65, 695)">
      <g fill="#0f172a">
        <rect x="0" y="0" width="3" height="55" />
        <rect x="6" y="0" width="4" height="55" />
        <rect x="13" y="0" width="2" height="55" />
        <rect x="18" y="0" width="5" height="55" />
        <rect x="26" y="0" width="2" height="55" />
        <rect x="31" y="0" width="4" height="55" />
        <rect x="38" y="0" width="3" height="55" />
        <rect x="44" y="0" width="6" height="55" />
        <rect x="53" y="0" width="2" height="55" />
        <rect x="58" y="0" width="4" height="55" />
        <rect x="65" y="0" width="2" height="55" />
        <rect x="70" y="0" width="5" height="55" />
        <rect x="78" y="0" width="3" height="55" />
        <rect x="84" y="0" width="5" height="55" />
        <rect x="92" y="0" width="2" height="55" />
        <rect x="97" y="0" width="4" height="55" />
        <rect x="104" y="0" width="2" height="55" />
        <rect x="109" y="0" width="5" height="55" />
        <rect x="117" y="0" width="3" height="55" />
        <rect x="123" y="0" width="6" height="55" />
        <rect x="132" y="0" width="2" height="55" />
        <rect x="137" y="0" width="4" height="55" />
        <rect x="144" y="0" width="3" height="55" />
        <rect x="150" y="0" width="5" height="55" />
        <rect x="158" y="0" width="2" height="55" />
        <rect x="163" y="0" width="5" height="55" />
        <rect x="171" y="0" width="3" height="55" />
        <rect x="177" y="0" width="5" height="55" />
        <rect x="185" y="0" width="2" height="55" />
        <rect x="190" y="0" width="4" height="55" />
        <rect x="197" y="0" width="3" height="55" />
        <rect x="203" y="0" width="5" height="55" />
        <rect x="211" y="0" width="2" height="55" />
        <rect x="216" y="0" width="6" height="55" />
        <rect x="225" y="0" width="2" height="55" />
        <rect x="230" y="0" width="4" height="55" />
        <rect x="237" y="0" width="3" height="55" />
        <rect x="243" y="0" width="5" height="55" />
        <rect x="251" y="0" width="2" height="55" />
        <rect x="256" y="0" width="4" height="55" />
        <rect x="263" y="0" width="3" height="55" />
        <rect x="269" y="0" width="5" height="55" />
        <rect x="277" y="0" width="2" height="55" />
        <rect x="282" y="0" width="4" height="55" />
        <rect x="289" y="0" width="3" height="55" />
        <rect x="295" y="0" width="6" height="55" />
        <rect x="304" y="0" width="2" height="55" />
      </g>
      <text x="155" y="78" fill="#475569" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">* 14028842 *</text>
    </g>

    <!-- Warm Footer & Store Brand -->
    <g transform="translate(30, 805)" text-anchor="middle" font-family="'Vazirmatn', Tahoma, sans-serif">
      <text x="190" y="24" fill="#0f172a" font-size="14" font-weight="900">از خرید و اعتماد شما صمیمانه سپاسگزاریم ❤️</text>
      <text x="190" y="46" fill="#64748b" font-size="11">سامانه صدور فاکتور و رسید حرارتی ووفاکتور (WooFactor)</text>
      <text x="190" y="66" fill="#94a3b8" font-size="10.5">www.yourstore.ir</text>
    </g>

    <!-- Serrated Bottom Edge -->
    <line x1="0" y1="997" x2="440" y2="997" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2" />
  </g>
</svg>