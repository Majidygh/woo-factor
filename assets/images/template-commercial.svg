<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780">
  <defs>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="780" fill="#e2e8f0" />

  <!-- Invoice Container -->
  <g transform="translate(30, 25)" filter="url(#cShadow)">
    <rect width="540" height="730" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Premium Navy Header -->
    <rect x="0" y="0" width="540" height="95" rx="8" fill="#0f172a" />
    <rect x="0" y="90" width="540" height="5" fill="#0284c7" />

    <rect x="25" y="24" width="50" height="48" rx="6" fill="#ffffff" />
    <text x="50" y="53" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">برند</text>

    <text x="90" y="46" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="16" font-weight="900">هلدینگ تجاری بازرگانی پارس</text>
    <text x="90" y="65" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="10.5">صورتحساب رسمی فروش کالا و خدمات تجاری</text>

    <!-- Header Meta Box -->
    <rect x="380" y="16" width="135" height="62" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="500" y="34" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">شماره فاکتور: INV-9921</text>
    <text x="500" y="49" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">تاریخ ثبت: ۱۴۰۲/۱۲/۱۵</text>
    <text x="500" y="64" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" text-anchor="end">وضعیت: تسویه شده</text>

    <!-- Parties Grid -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="240" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="230" y="22" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="end">🏢 مشخصات فروشنده</text>
      <line x1="10" y1="30" x2="230" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="230" y="48" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">فروشگاه: بازرگانی بین‌المللی پارس</text>
      <text x="230" y="64" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">شناسه ملی: ۱۰۱۰۸۹۷۶۴۵۱</text>
      <text x="230" y="80" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">تلفن: ۰۲۱-۸۸۹۹۰۰۱۱</text>

      <rect x="260" y="0" width="240" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="490" y="22" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="end">👤 مشخصات خریدار</text>
      <line x1="270" y1="30" x2="490" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="490" y="48" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">نام خریدار: شرکت مهندسی رایان</text>
      <text x="490" y="64" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">کد ملی / شناسه: ۱۰۲۶۰۳۵۴۷۸۹</text>
      <text x="490" y="80" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">نشانی: شیراز، بلوار زند، پلاک ۱۱۰</text>
    </g>

    <!-- Commercial Items Table -->
    <g transform="translate(20, 230)">
      <rect width="500" height="195" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <rect width="500" height="30" rx="6" fill="#0f172a" />
      <text x="485" y="20" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9.5" font-weight="bold" text-anchor="end">شرح کالا یا خدمات تجاری</text>
      <text x="230" y="20" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9.5" font-weight="bold" text-anchor="end">تعداد</text>
      <text x="160" y="20" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9.5" font-weight="bold" text-anchor="end">مبلغ واحد</text>
      <text x="60" y="20" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9.5" font-weight="bold" text-anchor="end">مبلغ کل (تومان)</text>

      <!-- Row 1 -->
      <text x="485" y="52" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">سرور ابری سازمانی مدل اختصاصی Enterprise</text>
      <text x="485" y="66" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="end">کد کالا: SRV-PARS-X | پشتیبانی ۲۴ ساعته</text>
      <text x="220" y="58" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">۱</text>
      <text x="175" y="58" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">۴۵,۰۰۰,۰۰۰</text>
      <text x="80" y="58" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">۴۵,۰۰۰,۰۰۰</text>
      <line x1="10" y1="80" x2="490" y2="80" stroke="#e2e8f0" />

      <!-- Row 2 -->
      <text x="485" y="104" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">لایسنس یک‌ساله فایروال امنیت شبکه</text>
      <text x="485" y="118" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="end">کد کالا: SEC-LIC-2024</text>
      <text x="220" y="110" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">۳</text>
      <text x="175" y="110" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">۵,۰۰۰,۰۰۰</text>
      <text x="80" y="110" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">۱۵,۰۰۰,۰۰۰</text>
    </g>

    <!-- Bottom Section -->
    <g transform="translate(20, 445)">
      <!-- Left: Signatures & Verification -->
      <rect x="0" y="0" width="260" height="175" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      
      <!-- Payment badge -->
      <rect x="10" y="10" width="240" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" />
      <text x="240" y="28" fill="#166534" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">روش پرداخت: درگاه شتاب آنلاین (موفق)</text>

      <!-- Stamp -->
      <rect x="10" y="48" width="115" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="67" y="70" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">مهر و امضای شرکت</text>
      <circle cx="67" cy="95" r="18" fill="none" stroke="#0284c7" stroke-width="2" />

      <!-- QR -->
      <rect x="135" y="48" width="115" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <rect x="172" y="60" width="40" height="40" fill="#0f172a" />
      <text x="192" y="115" fill="#64748b" font-family="Tahoma, sans-serif" font-size="7.5" text-anchor="middle">استعلام اصالت</text>

      <text x="240" y="150" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8" text-anchor="end">شرایط: خدمات شامل ۱۲ ماه گارانتی طلایی پارس می‌باشد.</text>

      <!-- Right: Commercial Summary -->
      <rect x="280" y="0" width="220" height="175" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="480" y="30" fill="#475569" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">مجموع اقلام: ۶۰,۰۰۰,۰۰۰ تومان</text>
      <text x="480" y="55" fill="#ef4444" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">تخفیف همکاری: ۲,۰۰۰,۰۰۰- تومان</text>
      <text x="480" y="80" fill="#475569" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">مالیات ارزش افزوده: ۵,۲۲۰,۰۰۰ تومان</text>

      <!-- Grand Total -->
      <rect x="280" y="105" width="220" height="50" rx="6" fill="#0f172a" />
      <text x="485" y="126" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">مبلغ کل قابل پرداخت:</text>
      <text x="485" y="145" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="13" font-weight="900" text-anchor="end">۶۳,۲۲۰,۰۰۰ تومان</text>
    </g>

    <!-- Footer -->
    <text x="270" y="670" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9" text-anchor="middle">صادر شده توسط ووفاکتور • سیستم فاکتور و برچسب پستی پیشرفته ووکامرس</text>
  </g>
</svg>
