<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bg)" />

  <!-- Subtle circles/shapes -->
  <circle cx="1100" cy="80" r="180" fill="#14b8a6" opacity="0.08" />
  <circle cx="150" cy="380" r="220" fill="#0284c7" opacity="0.07" />

  <!-- Content Container -->
  <g transform="translate(60, 40)">
    <!-- Right side: Persian text & highlights -->
    <!-- Badge -->
    <rect x="740" y="20" width="340" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="910" y="42" fill="#5eead4" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" direction="rtl">
      🚀 نسخه ۲.۰ • سازگار کامل با HPOS و ووکامرس
    </text>

    <!-- Main Title -->
    <text x="1080" y="105" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="38" font-weight="900" text-anchor="end">
      ووفاکتور | Woo Factor
    </text>

    <!-- Subtitle -->
    <text x="1080" y="145" fill="#99f6e4" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="18" font-weight="bold" text-anchor="end">
      پیشرفته‌ترین افزونه صدور و چاپ فاکتور رسمی و تجاری برای ووکامرس
    </text>

    <!-- Feature Tags -->
    <g transform="translate(680, 180)">
      <!-- Row 1 -->
      <rect x="250" y="0" width="150" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="325" y="21" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">۳ قالب اختصاصی فاکتور</text>

      <rect x="80" y="0" width="155" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="157" y="21" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">کد QR و بارکد هوشمند</text>

      <rect x="-80" y="0" width="145" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="-8" y="21" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">آپلود مهر و امضای شفاف</text>

      <!-- Row 2 -->
      <rect x="250" y="45" width="150" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="325" y="66" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">واترمارک وضعیت پرداخت</text>

      <rect x="80" y="45" width="155" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="157" y="66" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">چاپ گروهی سفارشات</text>

      <rect x="-80" y="45" width="145" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" />
      <text x="-8" y="66" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="12" text-anchor="middle">استاندارد رسمی دارایی</text>
    </g>

    <!-- Left side: 3 Mockup Cards Showcase -->
    <g transform="translate(40, 20)">
      <!-- Card 3 (Commercial) Back -->
      <g transform="translate(180, 40) rotate(8)" filter="url(#shadow)">
        <rect width="200" height="270" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
        <rect x="15" y="15" width="170" height="24" rx="4" fill="#1e293b" />
        <text x="100" y="31" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">قالب تجاری (Commercial)</text>
        <rect x="15" y="50" width="80" height="40" rx="4" fill="#1e293b" />
        <rect x="105" y="50" width="80" height="40" rx="4" fill="#1e293b" />
        <rect x="15" y="100" width="170" height="110" rx="4" fill="#1e293b" />
        <rect x="15" y="220" width="80" height="35" rx="4" fill="#1e293b" />
        <rect x="105" y="220" width="80" height="35" rx="4" fill="#38bdf8" fill-opacity="0.3" />
      </g>

      <!-- Card 2 (Modern) Middle -->
      <g transform="translate(100, 20) rotate(-4)" filter="url(#shadow)">
        <rect width="210" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
        <rect x="10" y="10" width="190" height="35" rx="6" fill="#2563eb" />
        <text x="105" y="32" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">قالب مدرن و مینیمال</text>
        <rect x="10" y="55" width="90" height="45" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
        <rect x="110" y="55" width="90" height="45" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
        <rect x="10" y="110" width="190" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
        <rect x="10" y="220" width="90" height="45" rx="4" fill="#eff6ff" />
        <rect x="110" y="220" width="90" height="45" rx="4" fill="#eff6ff" stroke="#2563eb" />
      </g>

      <!-- Card 1 (Classic) Front -->
      <g transform="translate(20, 0) rotate(0)" filter="url(#shadow)">
        <rect width="220" height="295" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" />
        <rect x="10" y="10" width="200" height="36" rx="4" fill="#f0fdf4" stroke="#86efac" />
        <text x="110" y="32" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">قالب رسمی دارایی (Tax)</text>
        
        <!-- Seller / Buyer -->
        <rect x="10" y="54" width="200" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" />
        <line x1="10" y1="75" x2="210" y2="75" stroke="#cbd5e1" />
        
        <!-- Table -->
        <rect x="10" y="104" width="200" height="110" rx="2" fill="#ffffff" stroke="#94a3b8" />
        <rect x="10" y="104" width="200" height="18" fill="#e2e8f0" />
        <line x1="10" y1="140" x2="210" y2="140" stroke="#f1f5f9" />
        <line x1="10" y1="160" x2="210" y2="160" stroke="#f1f5f9" />
        <line x1="10" y1="180" x2="210" y2="180" stroke="#f1f5f9" />
        <line x1="10" y1="195" x2="210" y2="195" stroke="#e2e8f0" />

        <!-- Totals & Stamp -->
        <rect x="10" y="222" width="110" height="58" rx="2" fill="#f8fafc" stroke="#cbd5e1" />
        <rect x="130" y="222" width="80" height="58" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,3" />
        <text x="170" y="254" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">مهر و امضا</text>
      </g>
    </g>
  </g>
</svg>
