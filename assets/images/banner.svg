<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#04201e" />
    </linearGradient>
    <radialGradient id="auroraTeal" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraIndigo" cx="15%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    
    <!-- Card Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />
  <rect width="1200" height="500" fill="url(#auroraTeal)" />
  <rect width="1200" height="500" fill="url(#auroraIndigo)" />

  <!-- Subtle Ambient Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
  </g>

  <!-- Left Side: 3D Floating Layered Mockups Showcase -->
  <g transform="translate(60, 45)">
    <!-- Layer 3 (Left back): Thermal 80mm POS Slip -->
    <g transform="translate(30, 60) rotate(-10)" filter="url(#heroShadow)">
      <rect width="165" height="310" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Serrated top -->
      <line x1="0" y1="2" x2="165" y2="2" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5" />
      <rect x="15" y="14" width="135" height="18" rx="4" fill="#0f172a" />
      <text x="82" y="27" fill="#38bdf8" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="9" font-weight="900" text-anchor="middle">رسید حرارتی ۸۰mm</text>
      <line x1="15" y1="40" x2="150" y2="40" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <rect x="15" y="48" width="135" height="10" rx="2" fill="#f1f5f9" />
      <rect x="15" y="62" width="135" height="10" rx="2" fill="#f1f5f9" />
      <line x1="15" y1="80" x2="150" y2="80" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <rect x="15" y="88" width="135" height="85" rx="3" fill="#f8fafc" />
      <rect x="15" y="185" width="135" height="26" rx="4" fill="#0f172a" />
      <text x="82" y="202" fill="#34d399" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="9" font-weight="900" text-anchor="middle">مبلغ کل قابل پرداخت</text>
      <!-- Mini barcode -->
      <g fill="#1e293b" transform="translate(25, 222)">
        <rect x="0" y="0" width="2" height="26" />
        <rect x="4" y="0" width="3" height="26" />
        <rect x="9" y="0" width="1" height="26" />
        <rect x="12" y="0" width="4" height="26" />
        <rect x="18" y="0" width="2" height="26" />
        <rect x="23" y="0" width="4" height="26" />
        <rect x="30" y="0" width="2" height="26" />
        <rect x="34" y="0" width="3" height="26" />
        <rect x="40" y="0" width="1" height="26" />
        <rect x="44" y="0" width="4" height="26" />
        <rect x="51" y="0" width="2" height="26" />
        <rect x="56" y="0" width="4" height="26" />
        <rect x="63" y="0" width="2" height="26" />
        <rect x="68" y="0" width="3" height="26" />
        <rect x="74" y="0" width="4" height="26" />
        <rect x="81" y="0" width="2" height="26" />
        <rect x="85" y="0" width="4" height="26" />
        <rect x="92" y="0" width="2" height="26" />
        <rect x="97" y="0" width="4" height="26" />
        <rect x="104" y="0" width="2" height="26" />
        <rect x="109" y="0" width="3" height="26" />
      </g>
      <text x="82" y="260" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8" text-anchor="middle">#۸۸۴۲</text>
      <line x1="0" y1="308" x2="165" y2="308" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5" />
    </g>

    <!-- Layer 2 (Middle): Modern Card Invoice -->
    <g transform="translate(140, 30) rotate(5)" filter="url(#heroShadow)">
      <rect width="215" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="10" y="10" width="195" height="50" rx="8" fill="url(#blueGrad)" />
      <text x="107" y="34" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="900" text-anchor="middle">قالب مدرن (Modern)</text>
      <text x="107" y="50" fill="#bfdbfe" font-family="Tahoma, sans-serif" font-size="9" text-anchor="middle">طراحی کارت‌محور با رنگ اختصاصی</text>
      <!-- Parties -->
      <rect x="10" y="68" width="92" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="113" y="68" width="92" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <!-- Table -->
      <rect x="10" y="124" width="195" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="10" y="124" width="195" height="20" rx="6" fill="#eff6ff" />
      <!-- Totals & Barcode -->
      <rect x="10" y="242" width="195" height="42" rx="6" fill="#0f172a" />
      <text x="107" y="268" fill="#38bdf8" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="900" text-anchor="middle">مبلغ کل: ۳۲,۴۵۰,۰۰۰ تومان</text>
      <rect x="50" y="294" width="115" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <text x="107" y="314" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">مهر و امضای دیجیتال</text>
    </g>

    <!-- Layer 1 (Front focus): Classic Tax Standard Invoice -->
    <g transform="translate(250, 0) rotate(-2)" filter="url(#heroShadow)">
      <rect width="230" height="365" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" />
      <!-- Header -->
      <rect x="10" y="10" width="210" height="52" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="115" y="32" fill="#0f766e" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">صورتحساب رسمی فروش کالا</text>
      <text x="115" y="48" fill="#15803d" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">استاندارد ماده ۱۹ مالیات بر ارزش افزوده</text>
      <!-- Parties Legal -->
      <rect x="10" y="68" width="210" height="56" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <line x1="10" y1="96" x2="220" y2="96" stroke="#e2e8f0" />
      <text x="210" y="85" fill="#334155" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">فروشنده: بازرگانی و تجارت الکترونیک</text>
      <text x="210" y="113" fill="#334155" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">خریدار: شخص حقوقی (شناسه ملی و کد اقتصادی)</text>
      <!-- Table rows -->
      <rect x="10" y="130" width="210" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" />
      <rect x="10" y="130" width="210" height="20" fill="#e2e8f0" />
      <line x1="10" y1="170" x2="220" y2="170" stroke="#f1f5f9" />
      <line x1="10" y1="190" x2="220" y2="190" stroke="#f1f5f9" />
      <line x1="10" y1="210" x2="220" y2="210" stroke="#f1f5f9" />
      <line x1="10" y1="230" x2="220" y2="230" stroke="#e2e8f0" />
      <!-- Totals & Seals -->
      <rect x="10" y="256" width="115" height="96" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="115" y="276" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">مبلغ کل قابل پرداخت</text>
      <text x="115" y="296" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="900" text-anchor="end">۲۷,۲۹۵,۰۰۰ تومان</text>
      <rect x="132" y="256" width="88" height="96" rx="4" fill="#ffffff" stroke="#0f766e" stroke-dasharray="3,3" />
      <circle cx="176" cy="304" r="22" fill="none" stroke="#0f766e" stroke-width="2" />
      <text x="176" y="308" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">مهر رسمی</text>
    </g>
  </g>

  <!-- Right Side: Clean Typography & Feature Grid -->
  <g transform="translate(680, 50)">
    <!-- Version Pill with Pulse -->
    <g transform="translate(190, 15)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#14b8a6" stroke-opacity="0.4" />
      <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
      <circle cx="20" cy="16" r="9" fill="#2dd4bf" fill-opacity="0.25" />
      <text x="165" y="21" fill="#5eead4" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        نسخه ۲.۱ • پیامک الگو محور + فیش‌پرینتر حرارتی
      </text>
    </g>

    <!-- Main Title -->
    <text x="500" y="105" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="38" font-weight="900" text-anchor="end" letter-spacing="-0.5">
      فاکتورساز حرفه‌ای ووفاکتور | <tspan fill="#2dd4bf">WooFactor</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="145" fill="#cbd5e1" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="16" font-weight="500" text-anchor="end">
      سامانه جامع و مدرن صدور فاکتور رسمی، فیش‌پرینتر و برچسب پستی ووکامرس
    </text>

    <!-- High-Impact Modern Feature Badges -->
    <g transform="translate(60, 185)">
      <!-- Card 1 -->
      <g transform="translate(230, 0)">
        <rect width="210" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
        <circle cx="185" cy="26" r="15" fill="#0d9488" fill-opacity="0.2" />
        <text x="185" y="31" font-size="14" text-anchor="middle">🧾</text>
        <text x="160" y="24" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">۳ قالب چاپی اختصاصی</text>
        <text x="160" y="40" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">رسمی دارایی، مدرن، حرارتی ۸۰mm</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
        <circle cx="185" cy="26" r="15" fill="#3b82f6" fill-opacity="0.2" />
        <text x="185" y="31" font-size="14" text-anchor="middle">📲</text>
        <text x="160" y="24" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">ارسال پیامک پترن فوری</text>
        <text x="160" y="40" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">۴ وب‌سرویس مطرح با عبور از بلک‌لیست</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(230, 68)">
        <rect width="210" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
        <circle cx="185" cy="26" r="15" fill="#8b5cf6" fill-opacity="0.2" />
        <text x="185" y="31" font-size="14" text-anchor="middle">🏢</text>
        <text x="160" y="24" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">مشتری حقیقی و حقوقی</text>
        <text x="160" y="40" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">کد اقتصادی، شناسه ملی و ثبت شرکت</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(0, 68)">
        <rect width="210" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
        <circle cx="185" cy="26" r="15" fill="#f59e0b" fill-opacity="0.2" />
        <text x="185" y="31" font-size="14" text-anchor="middle">📮</text>
        <text x="160" y="24" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">برچسب پستی پیشرفته</text>
        <text x="160" y="40" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">موبایل، یادداشت مشتری و بارکد کالا</text>
      </g>
    </g>

    <!-- Bottom Compatibility & Tech Row -->
    <g transform="translate(60, 345)">
      <rect width="440" height="38" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="220" y="24" fill="#94a3b8" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" text-anchor="middle">
        سازگار ۱۰۰٪ با <tspan fill="#ffffff" font-weight="bold">WooCommerce HPOS</tspan> • بدون وابستگی خارجی • فونت محلی وزیرمتن
      </text>
    </g>
  </g>
</svg>
