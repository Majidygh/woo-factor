<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <filter id="mShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.1" />
    </filter>
    <linearGradient id="modernHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1050" fill="#f8fafc" />

  <!-- Main Invoice Card -->
  <g transform="translate(40, 30)" filter="url(#mShadow)">
    <rect width="720" height="990" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Modern Header Banner -->
    <rect x="25" y="25" width="670" height="110" rx="12" fill="url(#modernHeaderGrad)" />
    
    <!-- Logo placeholder -->
    <rect x="45" y="45" width="70" height="70" rx="10" fill="#ffffff" />
    <circle cx="80" cy="70" r="16" fill="#2563eb" fill-opacity="0.15" />
    <text x="80" y="75" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">لوگو</text>

    <!-- Shop & Order Info -->
    <text x="135" y="68" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="20" font-weight="900">فروشگاه آنلاین مدرن‌استور</text>
    <text x="135" y="94" fill="#bfdbfe" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13">فاکتور سفارش رسمی شماره #۸۸۴۲</text>

    <!-- Status & Date Pill -->
    <g transform="translate(565, 45)">
      <rect width="110" height="28" rx="14" fill="#10b981" />
      <circle cx="20" cy="14" r="4" fill="#ffffff" />
      <text x="62" y="19" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">پرداخت موفق</text>
    </g>
    <text x="675" y="98" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="11" text-anchor="end">تاریخ: ۱۴۰۲/۱۲/۱۵</text>
    <text x="675" y="116" fill="#bfdbfe" font-family="Tahoma, sans-serif" font-size="10.5" text-anchor="end">ساعت: ۱۴:۳۵</text>

    <!-- Parties Cards Grid -->
    <g transform="translate(25, 155)">
      <!-- Seller Card -->
      <rect x="0" y="0" width="325" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="300" cy="25" r="12" fill="#3b82f6" fill-opacity="0.15" />
      <text x="300" y="29" font-size="12" text-anchor="middle">🏢</text>
      <text x="280" y="28" fill="#1e40af" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12.5" font-weight="bold" text-anchor="end">مشخصات فروشنده</text>
      <line x1="15" y1="42" x2="310" y2="42" stroke="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="10.5" fill="#475569">
        <text x="310" y="60" text-anchor="end">فروشگاه: مدرن کالا تجارت الکترونیک</text>
        <text x="310" y="78" text-anchor="end">شناسه ملی: ۱۰۱۰۴۵۸۹۲۳۱</text>
        <text x="310" y="96" text-anchor="end">تلفن: ۰۲۱-۲۲۸۸۹۹۰۰ • تهران، خیابان جردن</text>
      </g>

      <!-- Buyer Card -->
      <rect x="345" y="0" width="325" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="645" cy="25" r="12" fill="#10b981" fill-opacity="0.15" />
      <text x="645" y="29" font-size="12" text-anchor="middle">👤</text>
      <text x="625" y="28" fill="#065f46" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12.5" font-weight="bold" text-anchor="end">مشخصات خریدار</text>
      <line x1="360" y1="42" x2="655" y2="42" stroke="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="10.5" fill="#475569">
        <text x="655" y="60" text-anchor="end">نام مشتری: علی رضایی</text>
        <text x="655" y="78" text-anchor="end">شماره تماس: ۰۹۱۲۳۴۵۶۷۸۹</text>
        <text x="655" y="96" text-anchor="end">نشانی: اصفهان، چهارباغ عباسی، پلاک ۴</text>
      </g>
    </g>

    <!-- Modern Items Table -->
    <g transform="translate(25, 285)">
      <rect width="670" height="235" rx="10" fill="#ffffff" stroke="#e2e8f0" />
      <rect width="670" height="36" rx="10" fill="#eff6ff" />
      <g font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af">
        <text x="655" y="24" text-anchor="end">محصول</text>
        <text x="340" y="24" text-anchor="end">تعداد</text>
        <text x="240" y="24" text-anchor="end">قیمت واحد</text>
        <text x="140" y="24" text-anchor="end">تخفیف</text>
        <text x="20" y="24" text-anchor="start">جمع کل</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(0, 48)">
        <rect x="625" y="4" width="32" height="32" rx="6" fill="#cbd5e1" />
        <text x="615" y="18" fill="#0f172a" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">ساعت هوشمند مدل Series 8 Ultra</text>
        <text x="615" y="32" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">کد کالا: WCH-800 | بند سیلیکونی نارنجی</text>
        <text x="340" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end">۱</text>
        <text x="240" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11.5" text-anchor="end">۱۴,۵۰۰,۰۰۰</text>
        <text x="140" y="24" fill="#ef4444" font-family="Tahoma, sans-serif" font-size="11.5" text-anchor="end">۵۰۰,۰۰۰-</text>
        <text x="20" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="12" font-weight="900" text-anchor="start">۱۴,۰۰۰,۰۰۰ تومان</text>
        <line x1="15" y1="44" x2="655" y2="44" stroke="#f1f5f9" />
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 102)">
        <rect x="625" y="4" width="32" height="32" rx="6" fill="#cbd5e1" />
        <text x="615" y="18" fill="#0f172a" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">بند مغناطیسی اضافه مدل میلانس</text>
        <text x="615" y="32" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">کد کالا: BND-102 | مشکی مات</text>
        <text x="340" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end">۲</text>
        <text x="240" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="11.5" text-anchor="end">۴۵۰,۰۰۰</text>
        <text x="140" y="24" fill="#64748b" font-family="Tahoma, sans-serif" font-size="11.5" text-anchor="end">-</text>
        <text x="20" y="24" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="12" font-weight="900" text-anchor="start">۹۰۰,۰۰۰ تومان</text>
        <line x1="15" y1="44" x2="655" y2="44" stroke="#f1f5f9" />
      </g>
    </g>

    <!-- Bottom Layout: Totals + Barcode & Stamp Card -->
    <g transform="translate(25, 540)">
      <!-- Left side: Barcode & Store Stamp Card -->
      <rect x="0" y="0" width="345" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="140" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="70" y="42" fill="#2563eb" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">مهر و امضای فروشگاه</text>

        <!-- Barcode -->
        <g fill="#0f172a" transform="translate(155, 12)">
          <rect x="0" y="0" width="2" height="34" />
          <rect x="4" y="0" width="3" height="34" />
          <rect x="9" y="0" width="1" height="34" />
          <rect x="12" y="0" width="4" height="34" />
          <rect x="18" y="0" width="2" height="34" />
          <rect x="23" y="0" width="4" height="34" />
          <rect x="30" y="0" width="2" height="34" />
          <rect x="34" y="0" width="3" height="34" />
          <rect x="40" y="0" width="1" height="34" />
          <rect x="44" y="0" width="4" height="34" />
          <rect x="51" y="0" width="2" height="34" />
          <rect x="56" y="0" width="4" height="34" />
          <rect x="63" y="0" width="2" height="34" />
          <rect x="68" y="0" width="3" height="34" />
          <rect x="74" y="0" width="4" height="34" />
          <rect x="81" y="0" width="2" height="34" />
          <rect x="85" y="0" width="4" height="34" />
          <rect x="92" y="0" width="2" height="34" />
          <rect x="97" y="0" width="4" height="34" />
          <rect x="104" y="0" width="2" height="34" />
          <rect x="109" y="0" width="3" height="34" />
          <rect x="114" y="0" width="4" height="34" />
        </g>
        <text x="215" y="60" fill="#64748b" font-family="Tahoma, sans-serif" font-size="10" text-anchor="middle">#۸۸۴۲</text>
        <text x="215" y="74" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="middle">بارکد سفارش</text>
      </g>
      <text x="325" y="125" fill="#475569" font-family="Tahoma, sans-serif" font-size="10" text-anchor="end">شرایط بازگشت کالا: ۷ روز ضمانت بازگشت و پشتیبانی آنلاین.</text>
      <text x="325" y="145" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">پرداخت شده از طریق درگاه پرداخت اینترنتی شاپرک (تراکنش موفق)</text>

      <!-- Right side: Modern Totals Card -->
      <rect x="365" y="0" width="305" height="190" rx="10" fill="#0f172a" />
      <g font-family="'Vazirmatn', Tahoma, sans-serif" fill="#ffffff" transform="translate(385, 25)">
        <text x="265" y="18" fill="#94a3b8" font-size="11" text-anchor="end">جمع اقلام:</text>
        <text x="0" y="18" font-size="12" font-weight="bold" text-anchor="start">۱۵,۴۰۰,۰۰۰ تومان</text>

        <text x="265" y="44" fill="#f87171" font-size="11" text-anchor="end">تخفیف سفارش:</text>
        <text x="0" y="44" fill="#f87171" font-size="12" font-weight="bold" text-anchor="start">۵۰۰,۰۰۰- تومان</text>

        <text x="265" y="70" fill="#94a3b8" font-size="11" text-anchor="end">هزینه ارسال:</text>
        <text x="0" y="70" fill="#34d399" font-size="12" font-weight="bold" text-anchor="start">رایگان</text>

        <line x1="0" y1="88" x2="265" y2="88" stroke="#334155" />

        <text x="265" y="120" fill="#38bdf8" font-size="14" font-weight="900" text-anchor="end">مبلغ نهایی:</text>
        <text x="0" y="120" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="start">۱۴,۹۰۰,۰۰۰ تومان</text>
        <text x="265" y="145" fill="#94a3b8" font-size="9.5" text-anchor="end">چهارده میلیون و نهصد هزار تومان</text>
      </g>
    </g>

    <!-- Footer -->
    <text x="360" y="780" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="10.5" text-anchor="middle">
      طراحی شده با نهایت دقت در فاکتورساز پیشرفته ووفاکتور (WooFactor)
    </text>
  </g>
</svg>