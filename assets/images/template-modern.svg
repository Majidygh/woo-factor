<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780">
  <defs>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.1" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="780" fill="#f8fafc" />

  <!-- Invoice Card -->
  <g transform="translate(30, 25)" filter="url(#mShadow)">
    <rect width="540" height="730" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Watermark -->
    <g transform="translate(270, 380) rotate(-28)">
      <rect x="-130" y="-30" width="260" height="60" rx="10" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8,6" opacity="0.07" />
      <text x="0" y="10" fill="#2563eb" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="32" font-weight="900" text-anchor="middle" opacity="0.08">پرداخت شد</text>
    </g>

    <!-- Header Banner -->
    <rect x="20" y="20" width="500" height="85" rx="10" fill="url(#headerGrad)" />
    <rect x="35" y="38" width="50" height="50" rx="8" fill="#ffffff" />
    <text x="60" y="68" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">لوگو</text>

    <text x="100" y="58" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="16" font-weight="900">فروشگاه مدرن کالا</text>
    <text x="100" y="76" fill="#bfdbfe" font-family="Tahoma, sans-serif" font-size="10.5">فاکتور خرید سفارش شماره #۸۸۴۲</text>

    <!-- Header Status Badge & Meta -->
    <rect x="420" y="36" width="85" height="24" rx="12" fill="#10b981" />
    <text x="462" y="52" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">تکمیل شده</text>
    <text x="505" y="76" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">تاریخ: ۱۴۰۲/۱۲/۱۵</text>
    <text x="505" y="90" fill="#bfdbfe" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">زمان: ۱۴:۳۵</text>

    <!-- Grid: Seller & Buyer Cards -->
    <g transform="translate(20, 120)">
      <!-- Seller Card -->
      <rect x="0" y="0" width="240" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="230" y="20" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="10.5" font-weight="bold" text-anchor="end">🏢 مشخصات فروشگاه</text>
      <line x1="10" y1="28" x2="230" y2="28" stroke="#e2e8f0" />
      <text x="230" y="46" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">فروشنده: فروشگاه آنلاین تکنولوژی</text>
      <text x="230" y="62" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">کد ملی: ۱۰۱۰۴۵۸۹۶۳۲</text>
      <text x="230" y="78" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">تلفن: ۰۲۱-۲۲۴۴۸۸۰۰</text>

      <!-- Buyer Card -->
      <rect x="260" y="0" width="240" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="490" y="20" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="10.5" font-weight="bold" text-anchor="end">👤 مشخصات خریدار</text>
      <line x1="270" y1="28" x2="490" y2="28" stroke="#e2e8f0" />
      <text x="490" y="46" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">نام مشتری: علی رضایی</text>
      <text x="490" y="62" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">کد ملی: ۰۰۱۲۳۴۵۶۷۸</text>
      <text x="490" y="78" fill="#475569" font-family="Tahoma, sans-serif" font-size="9" text-anchor="end">نشانی: اصفهان، چهارباغ عباسی، پلاک ۴</text>
    </g>

    <!-- Items Table -->
    <g transform="translate(20, 230)">
      <rect width="500" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <rect width="500" height="32" rx="8" fill="#eff6ff" />
      <text x="490" y="21" fill="#1e40af" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">محصول</text>
      <text x="230" y="21" fill="#1e40af" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">تعداد</text>
      <text x="160" y="21" fill="#1e40af" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">قیمت واحد</text>
      <text x="60" y="21" fill="#1e40af" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">جمع کل</text>

      <!-- Row 1 with thumbnail -->
      <rect x="460" y="42" width="30" height="30" rx="4" fill="#cbd5e1" />
      <text x="445" y="54" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">ساعت هوشمند مدل Series 8</text>
      <text x="445" y="68" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="end">کد: WCH-900 | رنگ: مشکی</text>
      <text x="220" y="60" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" text-anchor="end">۱</text>
      <text x="175" y="60" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" text-anchor="end">۱۲,۸۰۰,۰۰۰</text>
      <text x="75" y="60" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10.5" font-weight="bold" text-anchor="end">۱۲,۸۰۰,۰۰۰</text>
      <line x1="10" y1="82" x2="490" y2="82" stroke="#f1f5f9" />

      <!-- Row 2 with thumbnail -->
      <rect x="460" y="94" width="30" height="30" rx="4" fill="#cbd5e1" />
      <text x="445" y="106" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">بند اضافه مغناطیسی میلانس</text>
      <text x="445" y="120" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="end">کد: BND-102 | سایز: ۴۵ میلی‌متر</text>
      <text x="220" y="112" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" text-anchor="end">۲</text>
      <text x="175" y="112" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10" text-anchor="end">۴۵۰,۰۰۰</text>
      <text x="75" y="112" fill="#0f172a" font-family="Tahoma, sans-serif" font-size="10.5" font-weight="bold" text-anchor="end">۹۰۰,۰۰۰</text>
    </g>

    <!-- Bottom Section -->
    <g transform="translate(20, 450)">
      <!-- Left: QR Code & Verification -->
      <rect x="0" y="0" width="260" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="25" y="20" width="60" height="60" fill="#1e293b" />
      <text x="55" y="94" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8" text-anchor="middle">اسکن و رهگیری</text>

      <rect x="110" y="20" width="130" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="175" y="55" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">مهر رسمی فروشگاه</text>

      <text x="245" y="125" fill="#64748b" font-family="Tahoma, sans-serif" font-size="8.5" text-anchor="end">شرایط: مهلت تعویض کالا ۷ روز کاری پس از تحویل می‌باشد.</text>

      <!-- Right: Totals Card -->
      <rect x="280" y="0" width="220" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="480" y="26" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">جمع اقلام: ۱۳,۷۰۰,۰۰۰ تومان</text>
      <text x="480" y="48" fill="#ef4444" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">تخفیف: ۳۰۰,۰۰۰- تومان</text>
      <text x="480" y="70" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="end">هزینه ارسال: رایگان</text>

      <!-- Grand Total Highlight -->
      <rect x="290" y="85" width="200" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" />
      <text x="475" y="105" fill="#1e40af" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="end">مبلغ کل نهایی:</text>
      <text x="475" y="123" fill="#2563eb" font-family="Tahoma, sans-serif" font-size="13" font-weight="900" text-anchor="end">۱۳,۴۰۰,۰۰۰ تومان</text>
    </g>

    <!-- Footer -->
    <text x="270" y="670" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="9" text-anchor="middle">ووفاکتور • نسل جدید فاکتورساز فوق‌سریع و مدرن ووکامرس</text>
  </g>
</svg>
