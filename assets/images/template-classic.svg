<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <filter id="pageShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="classicTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1050" fill="#f1f5f9" />

  <!-- Sheet -->
  <g transform="translate(40, 30)" filter="url(#pageShadow)">
    <rect width="720" height="990" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="720" height="6" rx="3" fill="url(#classicTopGrad)" />

    <!-- Watermark -->
    <g transform="translate(360, 520) rotate(-28)">
      <rect x="-180" y="-40" width="360" height="80" rx="12" fill="none" stroke="#0f766e" stroke-width="5" stroke-dasharray="10,8" opacity="0.07" />
      <text x="0" y="14" fill="#0f766e" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="44" font-weight="900" text-anchor="middle" opacity="0.08">پرداخت شد</text>
    </g>

    <!-- Header Section -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="130" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="65" y="38" fill="#0f766e" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">لوگوی فروشگاه</text>

      <text x="330" y="38" fill="#0f172a" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="20" font-weight="900" text-anchor="middle">صورتحساب رسمی فروش کالا و خدمات</text>

      <rect x="490" y="0" width="170" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#334155">
        <text x="645" y="22" text-anchor="end">شماره فاکتور: <tspan font-weight="bold" fill="#0f172a">۱۴۰۲-۸۸۴۲</tspan></text>
        <text x="645" y="40" text-anchor="end">تاریخ صدور: <tspan font-weight="bold">۱۴۰۲/۱۲/۱۵</tspan></text>
        <text x="645" y="58" text-anchor="end">وضعیت: <tspan fill="#0f766e" font-weight="bold">تکمیل شده</tspan></text>
      </g>
    </g>

    <!-- Section A: Seller -->
    <g transform="translate(30, 110)">
      <rect width="660" height="26" rx="4" fill="#0f766e" />
      <text x="645" y="18" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">الف) مشخصات فروشنده (مودی)</text>

      <rect y="26" width="660" height="74" fill="#ffffff" stroke="#cbd5e1" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#334155">
        <text x="645" y="44" text-anchor="end">نام شرکت: <tspan font-weight="bold" fill="#0f172a">شرکت بازرگانی پارس گستر آنلاین</tspan></text>
        <text x="320" y="44" text-anchor="end">شماره اقتصادی: <tspan font-weight="bold">۴۱۱۴۸۹۳۵۲۱</tspan></text>
        <text x="645" y="68" text-anchor="end">شناسه ملی: <tspan font-weight="bold">۱۰۱۰۸۹۴۷۵۲۳</tspan></text>
        <text x="320" y="68" text-anchor="end">شماره ثبت: <tspan font-weight="bold">۵۸۴۹۲</tspan> | کد پستی: <tspan font-weight="bold">۱۹۳۹۵۱۲۳۴۵</tspan></text>
        <text x="645" y="92" text-anchor="end">نشانی: <tspan fill="#64748b">تهران، خیابان ولیعصر، تقاطع بهشتی، برج آرین - تلفن: ۰۲۱-۸۸۹۹۰۰۱۱</tspan></text>
      </g>
    </g>

    <!-- Section B: Buyer -->
    <g transform="translate(30, 225)">
      <rect width="660" height="26" rx="4" fill="#0f172a" />
      <text x="645" y="18" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">ب) مشخصات خریدار</text>
      <rect x="15" y="4" width="95" height="18" rx="9" fill="#14b8a6" />
      <text x="62" y="17" fill="#ffffff" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">شخص حقوقی</text>

      <rect y="26" width="660" height="74" fill="#ffffff" stroke="#cbd5e1" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#334155">
        <text x="645" y="44" text-anchor="end">نام خریدار / شرکت: <tspan font-weight="bold" fill="#0f172a">شرکت نوآوران داده‌پرداز کیان</tspan></text>
        <text x="320" y="44" text-anchor="end">شماره اقتصادی: <tspan font-weight="bold">۴۱۱۵۶۳۲۸۹۰</tspan></text>
        <text x="645" y="68" text-anchor="end">شناسه ملی: <tspan font-weight="bold">۱۰۲۶۰۴۸۹۵۳۱</tspan></text>
        <text x="320" y="68" text-anchor="end">تلفن همراه: <tspan font-weight="bold">۰۹۱۲۳۴۵۶۷۸۹</tspan> | کد پستی: <tspan font-weight="bold">۸۱۶۴۵۷۹۸۲۱</tspan></text>
        <text x="645" y="92" text-anchor="end">نشانی تحویل: <tspan fill="#64748b">اصفهان، میدان آزادی، بلوار دانشگاه، ساختمان فن‌آفرینی</tspan></text>
      </g>
    </g>

    <!-- Section C: Items Table -->
    <g transform="translate(30, 340)">
      <rect width="660" height="26" rx="4" fill="#334155" />
      <text x="645" y="18" fill="#ffffff" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="end">ج) مشخصات کالا یا خدمات مورد معامله</text>

      <rect y="26" width="660" height="180" fill="#ffffff" stroke="#94a3b8" />
      <rect y="26" width="660" height="30" fill="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">
        <text x="645" y="46" text-anchor="end">ردیف</text>
        <text x="500" y="46" text-anchor="end">شرح کالا یا خدمت</text>
        <text x="340" y="46" text-anchor="end">تعداد</text>
        <text x="270" y="46" text-anchor="end">مبلغ واحد (تومان)</text>
        <text x="175" y="46" text-anchor="end">تخفیف</text>
        <text x="100" y="46" text-anchor="end">مالیات (۱۰٪)</text>
        <text x="15" y="46" text-anchor="start">مبلغ کل (تومان)</text>
      </g>

      <!-- Row 1 -->
      <line x1="0" y1="88" x2="660" y2="88" stroke="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#1e293b">
        <text x="645" y="76" text-anchor="end">۱</text>
        <text x="500" y="70" text-anchor="end" font-weight="bold">گوشی موبایل هوشمند مدل Pro 5G</text>
        <text x="500" y="84" text-anchor="end" font-size="9.5" fill="#64748b">کد کالا: SMP-501 | گارانتی ۱۸ ماهه شرکتی</text>
        <text x="340" y="76" text-anchor="end">۱</text>
        <text x="270" y="76" text-anchor="end">۲۴,۵۰۰,۰۰۰</text>
        <text x="175" y="76" text-anchor="end" fill="#ef4444">۵۰۰,۰۰۰</text>
        <text x="100" y="76" text-anchor="end">۲,۴۰۰,۰۰۰</text>
        <text x="15" y="76" text-anchor="start" font-weight="bold">۲۶,۴۰۰,۰۰۰</text>
      </g>

      <!-- Row 2 -->
      <line x1="0" y1="124" x2="660" y2="124" stroke="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#1e293b">
        <text x="645" y="112" text-anchor="end">۲</text>
        <text x="500" y="106" text-anchor="end" font-weight="bold">شارژر فست شارژ ۶۵ وات GaN</text>
        <text x="500" y="120" text-anchor="end" font-size="9.5" fill="#64748b">کد کالا: CHR-65W | استاندارد PD 3.0</text>
        <text x="340" y="112" text-anchor="end">۲</text>
        <text x="270" y="112" text-anchor="end">۸۵۰,۰۰۰</text>
        <text x="175" y="112" text-anchor="end">۰</text>
        <text x="100" y="112" text-anchor="end">۱۷۰,۰۰۰</text>
        <text x="15" y="112" text-anchor="start" font-weight="bold">۱,۸۷۰,۰۰۰</text>
      </g>

      <!-- Row 3 -->
      <line x1="0" y1="160" x2="660" y2="160" stroke="#e2e8f0" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#1e293b">
        <text x="645" y="148" text-anchor="end">۳</text>
        <text x="500" y="148" text-anchor="end" font-weight="bold">کابل تایپ سی ۲ متری با روکش کنفی</text>
        <text x="340" y="148" text-anchor="end">۱</text>
        <text x="270" y="148" text-anchor="end">۲۵۰,۰۰۰</text>
        <text x="175" y="148" text-anchor="end">۰</text>
        <text x="100" y="148" text-anchor="end">۲۵,۰۰۰</text>
        <text x="15" y="148" text-anchor="start" font-weight="bold">۲۷۵,۰۰۰</text>
      </g>
    </g>

    <!-- Totals Summary -->
    <g transform="translate(30, 560)">
      <rect width="660" height="80" rx="4" fill="#ffffff" stroke="#94a3b8" />
      <rect width="660" height="38" rx="4" fill="#f8fafc" />
      <g font-family="Tahoma, sans-serif" font-size="11" fill="#334155">
        <text x="645" y="24" text-anchor="end">جمع کل اقلام: <tspan font-weight="bold" fill="#0f172a">۲۶,۴۵۰,۰۰۰ تومان</tspan></text>
        <text x="440" y="24" text-anchor="end">مجموع تخفیفات: <tspan font-weight="bold" fill="#ef4444">۵۰۰,۰۰۰ تومان</tspan></text>
        <text x="240" y="24" text-anchor="end">مالیات: <tspan font-weight="bold">۲,۵۹۵,۰۰۰ تومان</tspan></text>
        <text x="15" y="24" text-anchor="start">حمل و نقل: <tspan font-weight="bold" fill="#0f766e">رایگان</tspan></text>
      </g>

      <rect y="38" width="660" height="42" fill="#f0fdf4" />
      <g font-family="'Vazirmatn', Tahoma, sans-serif">
        <text x="645" y="64" fill="#0f766e" font-size="13.5" font-weight="900" text-anchor="end">
          مبلغ کل قابل پرداخت: ۲۸,۵۴۵,۰۰۰ تومان
        </text>
        <text x="15" y="64" fill="#475569" font-size="10.5" text-anchor="start">
          به حروف: بیست و هشت میلیون و پانصد و چهل و پنج هزار تومان
        </text>
      </g>
    </g>

    <!-- Signatures & Barcode -->
    <g transform="translate(30, 665)">
      <!-- Seller Stamp -->
      <rect x="450" y="0" width="210" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4,4" />
      <text x="555" y="24" fill="#334155" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">مهر و امضای فروشنده</text>
      <circle cx="555" cy="66" r="26" fill="none" stroke="#0f766e" stroke-width="2" />
      <text x="555" y="64" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">شرکت بازرگانی پارس</text>
      <text x="555" y="76" fill="#0f766e" font-family="Tahoma, sans-serif" font-size="8" text-anchor="middle">امضا و تأیید شد</text>

      <!-- Buyer Sig -->
      <rect x="225" y="0" width="210" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4,4" />
      <text x="330" y="24" fill="#334155" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">امضای خریدار / تحویل‌گیرنده</text>
      <text x="330" y="68" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="10" text-anchor="middle">کالا سالم تحویل شد</text>

      <!-- Barcode -->
      <rect x="0" y="0" width="210" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="105" y="24" fill="#334155" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">بارکد رهگیری سفارش</text>
      <g fill="#0f172a" transform="translate(35, 36)">
        <rect x="0" y="0" width="2" height="32" />
        <rect x="4" y="0" width="3" height="32" />
        <rect x="9" y="0" width="1" height="32" />
        <rect x="12" y="0" width="4" height="32" />
        <rect x="18" y="0" width="2" height="32" />
        <rect x="23" y="0" width="3" height="32" />
        <rect x="29" y="0" width="5" height="32" />
        <rect x="37" y="0" width="2" height="32" />
        <rect x="42" y="0" width="3" height="32" />
        <rect x="48" y="0" width="1" height="32" />
        <rect x="52" y="0" width="4" height="32" />
        <rect x="59" y="0" width="2" height="32" />
        <rect x="64" y="0" width="3" height="32" />
        <rect x="70" y="0" width="5" height="32" />
        <rect x="78" y="0" width="2" height="32" />
        <rect x="83" y="0" width="3" height="32" />
        <rect x="89" y="0" width="4" height="32" />
        <rect x="96" y="0" width="2" height="32" />
        <rect x="101" y="0" width="4" height="32" />
        <rect x="108" y="0" width="2" height="32" />
        <rect x="113" y="0" width="5" height="32" />
        <rect x="121" y="0" width="2" height="32" />
        <rect x="126" y="0" width="4" height="32" />
        <rect x="133" y="0" width="2" height="32" />
      </g>
      <text x="105" y="86" fill="#64748b" font-family="Tahoma, sans-serif" font-size="9.5" text-anchor="middle">#۱۴۰۲-۸۸۴۲</text>
    </g>

    <text x="360" y="800" fill="#94a3b8" font-family="Tahoma, sans-serif" font-size="10" text-anchor="middle">
      صادر شده توسط سامانه فاکتورساز رسمی ووفاکتور (WooFactor)
    </text>
  </g>
</svg>